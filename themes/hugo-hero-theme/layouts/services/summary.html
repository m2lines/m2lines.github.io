<div class="service service-summary">
  {{ with .Params.icon }}
  <div class="service-image">
    <img src="{{ . | absURL }}" alt="" loading="lazy">
  </div>
  {{ end }}
  <div class="service-content">
    {{ with .Title }}<h3 class="service-title">{{ . }}</h3>{{ end }}
    {{ .Content | truncate 120 "..." }}
  </div>
</div>
